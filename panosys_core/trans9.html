    <script>
        window.addEventListener('load', () => {
            const canvas = document.querySelector('canvas');
            if (!canvas) return;

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0 && typeof window.handleInteractionStart === 'function') {
                    const touch = e.touches[0];
                    if (window.handleInteractionStart(touch.clientX, touch.clientY)) {
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0 && typeof window.handleInteractionMove === 'function') {
                    const touch = e.touches[0];
                    window.handleInteractionMove(touch.clientX, touch.clientY);
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length > 0 && typeof window.handleInteractionEnd === 'function') {
                    const touch = e.changedTouches[0];
                    window.handleInteractionEnd(touch.clientX, touch.clientY);
                }
            });
        });
    </script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        canvas, #canvas-2D { touch-action: none !important; width: 100vw !important; height: 100vh !important; }

        @media (max-width: 900px) and (orientation: portrait) {

<body><div id="rotate-warning">
    <div style="font-size: 24px; margin-bottom: 15px;">⟳</div>
    <h2 style="font-size: 14px; letter-spacing: 2px; margin-bottom: 10px;">ROTATE YOUR DEVICE</h2>
    <p style="font-size: 10px; color: #00aa44;">THIS SYSTEM REQUIRES LANDSCAPE MODE TO OPERATE</p></div>

<div id="vg"></div>
<canvas id="matrix-canvas"></canvas>

<script>
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  const CHARS = '01XØ█▓▒░▄▀■┼║╚╔╗╝═▲▼/\\*+:'.split('');
  
  let cols, rows;
  const fontSize = 16;
  let gridData = [];
  let scrollOffset = 0;

  // --- MOTOR DE AUDIO: CRACKLE DIGITAL ÁSPERO E INDUSTRIAL + SUB-GRAVES GLITCH ---
  let audioCtx = null;
  let masterGain = null;
  let bitcrushNode = null;
  let noiseNode = null;

  const LOW_FREQS = [60.20, 58.27, 77.78,120]; 

  function makeBitcrushCurve(bits = 1.0) {
    let steps = Math.pow(2, bits),
        n_samples = 44100,
        curve = new Float32Array(n_samples);
    for (let i = 0; i < n_samples; ++i) {
      let x = (i * 2) / n_samples - 1;
      curve[i] = Math.round(x * steps) / steps;
    }
    return curve;
  }

  function initAudioEngine() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext({ sampleRate: 44100 });
    
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime); 

    bitcrushNode = audioCtx.createWaveShaper();
    bitcrushNode.curve = makeBitcrushCurve(8.0);
    bitcrushNode.oversample = 'none';

    const bufferSize = audioCtx.sampleRate * 1;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      let val = Math.random() < 0.05 ? (Math.random() * 2 - 1) * 1.5 : (Math.random() < 0.2 ? (Math.random() * 2 - 1) * 0.2 : 0);
      output[i] = val;
    }

    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuffer;
    noiseNode.loop = true;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    
    noiseNode.connect(noiseGain);
    noiseGain.connect(bitcrushNode);

    bitcrushNode.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    noiseNode.start(0);

    setInterval(triggerStrobeGlitch, 25);
  }

  function triggerStrobeGlitch() {
    if (!audioCtx || audioCtx.state !== 'running') return;

    if (Math.random() < 0.1) return;

    const now = audioCtx.currentTime;
    const duration = 0.003 + (Math.random() * 0.012);

    const osc = audioCtx.createOscillator();
    const pulseGain = audioCtx.createGain();

    osc.type = Math.random() < 0.5 ? 'sawtooth' : 'square';
    const baseFreq = LOW_FREQS[Math.floor(Math.random() * LOW_FREQS.length)];
    
    osc.frequency.setValueAtTime(baseFreq * (Math.random() < 0.5 ? 1 : 4.2), now);
    osc.frequency.linearRampToValueAtTime(baseFreq * 0.2, now + duration);

    pulseGain.gain.setValueAtTime(0.7, now);
    pulseGain.gain.setValueAtTime(0.0, now + duration);

    osc.connect(pulseGain);
    pulseGain.connect(bitcrushNode);

    osc.start(now);
    osc.stop(now + duration + 0.002);
  }

  window.addEventListener('DOMContentLoaded', () => {
    initAudioEngine();
    setTimeout(triggerStart, 100);
  });

  function triggerStart() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  window.addEventListener('click', triggerStart);
  window.addEventListener('keydown', triggerStart);
  window.addEventListener('touchstart', triggerStart);

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / (fontSize * 0.6));
    rows = Math.floor(canvas.height / fontSize) + 5;

    gridData = [];
    for (let r = 0; r < rows * 2; r++) {
      let rowCells = [];
      for (let c = 0; c < cols; c++) {
        rowCells.push({
          char: CHARS[Math.floor(Math.random() * CHARS.length)],
          infected: false,
          level: 0,
          colorType: 0
        });
      }
      gridData.push(rowCells);
    }
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function updateSimulation() {
    const totalCells = cols * rows;
    const infectionSpeed = Math.floor(totalCells * 0.008) + 5;

    for (let k = 0; k < infectionSpeed; k++) {
      let r = Math.floor(Math.random() * gridData.length);
      let c = Math.floor(Math.random() * cols);
      
      let cell = gridData[r][c];
      cell.infected = true;
      cell.level = Math.min(cell.level + 1, 3);
      cell.char = CHARS[Math.floor(Math.random() * CHARS.length)];

      const rand = Math.random();
      if (rand < 0.3) cell.colorType = 1;
      else if (rand < 0.55) cell.colorType = 2;
      else if (rand < 0.8) cell.colorType = 3;
      else cell.colorType = 4;
    }

    // Invertimos la dirección del desplazamiento: restamos en lugar de sumar para que ascienda
    scrollOffset += 3.5;
    if (scrollOffset >= fontSize) {
      scrollOffset = 0;
      // Quitamos del principio y añadimos al final para mantener el flujo ascendente constante
      gridData.shift();
      let newRow = [];
      for (let c = 0; c < cols; c++) {
        newRow.push({
          char: CHARS[Math.floor(Math.random() * CHARS.length)],
          infected: false,
          level: 0,
          colorType: 0
        });
      }
      gridData.push(newRow);
    }
  }

  function draw() {
    const isStrobeFrame = Math.random() < 0.2;

    ctx.fillStyle = isStrobeFrame ? '#ffffff' : '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${fontSize}px Consolas, 'Courier New', Courier, monospace`;
    ctx.textBaseline = 'top';

    const xOffsetChar = fontSize * 0.6;

    for (let r = 0; r < gridData.length; r++) {
      // Ajustamos el cálculo de la coordenada Y restando el offset para dirigir el flujo hacia arriba
      let y = (r * fontSize) - (fontSize - scrollOffset);
      if (y < -fontSize || y > canvas.height) continue;

      for (let c = 0; c < cols; c++) {
        let cell = gridData[r][c];
        let x = c * xOffsetChar;

        if (isStrobeFrame) {
          ctx.fillStyle = '#000000';
        } else {
          if (cell.colorType === 1) ctx.fillStyle = '#004400';
          else if (cell.colorType === 2) ctx.fillStyle = '#00ff00';
          else if (cell.colorType === 3) ctx.fillStyle = '#ff0000';
          else if (cell.colorType === 4) ctx.fillStyle = '#00ff00';
          else ctx.fillStyle = '#031103';
        }

        ctx.fillText(cell.char, x, y);
      }
    }
  }

  function loop() {
    updateSimulation();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
<script>
(function() {
    const style = document.createElement('style');
    style.innerHTML = `
        *, *::before, *::after {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none !important;
        }
    `;
    document.head.appendChild(style);

    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        function simulateMouseEvent(type, touch) {
            const mouseEvent = new MouseEvent(type, {
                bubbles: true, cancelable: true, view: window,
                clientX: touch.clientX, clientY: touch.clientY, button: 0
            });
            touch.target.dispatchEvent(mouseEvent);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                e.preventDefault();
                simulateMouseEvent('mousedown', e.touches[0]);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                e.preventDefault();
                simulateMouseEvent('mousemove', e.touches[0]);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            const touch = e.changedTouches[0] || e.touches[0];
            if (touch) simulateMouseEvent('mouseup', touch);
        }, { passive: true });
    });
})();
</script>
<style>
    *, *::before, *::after {

</style>

<script>
(function() {
    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        let initialPinchDistance = null;

        function simulateMouseEvent(type, touch, button = 0) {
            const mouseEvent = new MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: touch.clientX,
                clientY: touch.clientY,
                button: button
            });
            touch.target.dispatchEvent(mouseEvent);
        }

        function getTouchDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousedown', e.touches[0], 0);
                initialPinchDistance = null;
            } else if (e.touches.length >= 2) {
                e.preventDefault();
                initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousemove', e.touches[0], 0);
            } else if (e.touches.length >= 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                const scaleFactor = currentDistance / initialPinchDistance;

                const zoomEvent = new CustomEvent('canvaszoom', {
                    detail: { scale: scaleFactor, distance: currentDistance }
                });
                canvas.dispatchEvent(zoomEvent);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            const touch = e.changedTouches[0] || e.touches[0];
            if (touch && e.touches.length === 0) {
                simulateMouseEvent('mouseup', touch, 0);
            }
        }, { passive: true });
    });
})();
</script>
