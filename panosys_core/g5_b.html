    <script>
        window.addEventListener('load', () => {
            const canvas = document.querySelector('canvas');
            if (!canvas) return;

            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length > 0 && typeof window.handleInteractionStart === 'function') {
                    const touch = e.touches[0];
                    if (window.handleInteractionStart(touch.clientX, touch.clientY)) {
                        e.preventDefault();
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0 && typeof window.handleInteractionMove === 'function') {
                    const touch = e.touches[0];
                    window.handleInteractionMove(touch.clientX, touch.clientY);
                    e.preventDefault();
                }
            }, { passive: false });

            canvas.addEventListener('touchend', (e) => {
                if (e.changedTouches.length > 0 && typeof window.handleInteractionEnd === 'function') {
                    const touch = e.changedTouches[0];
                    window.handleInteractionEnd(touch.clientX, touch.clientY);
                }
            });
        });

        const densityStr = " .:-=+*#%@@"; 
        const asciiWidth = 70; 
        
        let assetCount = 0;

        let isInspecting = false;

        // ─── AUDIO SYSTEM: TELECOM BITCRUSHER & MODEM NOISE ─────────────────
        let audioCtx = null;
        let bitcrusherNode = null;
        let audioBus = null;

        function createBitcrusher(ctx, bits = 4, normFreq = 0.08) {
            const node = ctx.createScriptProcessor(4096, 1, 1);
            let step = Math.pow(0.5, bits);
            let phaser = 0;
            let last = 0;

            node.onaudioprocess = function(e) {
                let input = e.inputBuffer.getChannelData(0);
                let output = e.outputBuffer.getChannelData(0);
                for (let i = 0; i < input.length; i++) {
                    phaser += normFreq;
                    if (phaser >= 1.0) {
                        phaser -= 1.0;
                        last = step * Math.floor(input[i] / step + 0.5);
                    }
                    output[i] = last;
                }
            };
            return node;
        }

        function initTelecomAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            audioBus = audioCtx.createGain();
            audioBus.gain.setValueAtTime(0.18, audioCtx.currentTime);

            bitcrusherNode = createBitcrusher(audioCtx, 4, 0.07);

            audioBus.connect(bitcrusherNode);
            bitcrusherNode.connect(audioCtx.destination);

            const carrierOsc = audioCtx.createOscillator();
            const carrierGain = audioCtx.createGain();
            
            carrierOsc.type = 'sawtooth';
            carrierOsc.frequency.setValueAtTime(40, audioCtx.currentTime);

            const lfo = audioCtx.createOscillator();
            lfo.type = 'square';
            lfo.frequency.setValueAtTime(30, audioCtx.currentTime);
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.setValueAtTime(12, audioCtx.currentTime);
            lfo.connect(carrierOsc.frequency);
            lfo.start();

            carrierGain.gain.setValueAtTime(0.22, audioCtx.currentTime);
            carrierOsc.connect(carrierGain);
            carrierGain.connect(audioBus);
            carrierOsc.start();

            scheduleTelecomBursts();
        }

        function triggerModemBurst() {
            if (!audioCtx) return;

            const osc1 = audioCtx.createOscillator();
            const osc2 = audioCtx.createOscillator();
            const burstGain = audioCtx.createGain();

            const freqs = [697, 770, 852, 941, 1209, 1336, 1477, 1770, 2400, 3100];
            const f1 = freqs[Math.floor(Math.random() * freqs.length)];
            const f2 = freqs[Math.floor(Math.random() * freqs.length)];

            osc1.type = 'square';
            osc2.type = 'sawtooth';

            osc1.frequency.setValueAtTime(f1, audioCtx.currentTime);
            osc2.frequency.setValueAtTime(f2, audioCtx.currentTime);

            osc1.frequency.exponentialRampToValueAtTime(f1 * (Math.random() > 0.5 ? 2.5 : 0.3), audioCtx.currentTime + 0.1);

            burstGain.gain.setValueAtTime(0.32, audioCtx.currentTime);
            burstGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.12);

            osc1.connect(burstGain);
            osc2.connect(burstGain);
            burstGain.connect(audioBus);

            osc1.start();
            osc2.start();
            osc1.stop(audioCtx.currentTime + 0.12);
            osc2.stop(audioCtx.currentTime + 0.12);
        }

        function scheduleTelecomBursts() {
            if (Math.random() > 0.3) {
                let burstCount = Math.floor(Math.random() * 5) + 1;
                for (let i = 0; i < burstCount; i++) {
                    setTimeout(() => triggerModemBurst(), i * 45);
                }
            }
            setTimeout(scheduleTelecomBursts, Math.random() * 1800 + 150);
        }

        function generateMetadata() {

            return `

                <div class="meta-row"><span>ATTENTION_DRAIN: ${drainRate}%</span> <span class="cure-text">ACTIVE</span></div>

        function captureLoop() {
            try {
                if (video.videoWidth > 0 && video.videoHeight > 0) {
                    
                    const videoRatio = video.videoHeight / video.videoWidth;
                    const asciiHeight = Math.floor(asciiWidth * videoRatio);
                    canvas.width = asciiWidth;
                    canvas.height = asciiHeight;

                    ctx.save();
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, -asciiWidth, 0, asciiWidth, asciiHeight);
                    ctx.restore();

                    const imageData = ctx.getImageData(0, 0, asciiWidth, asciiHeight);
                    const pixels = imageData.data;
                    let asciiImage = "";

                    for (let i = 0; i < pixels.length; i += 4) {
                        const r = pixels[i]; const g = pixels[i + 1]; const b = pixels[i + 2];
                        const brightness = (0.299 * r + 0.587 * g + 0.114 * b);
                        const charIndex = Math.floor((brightness / 255) * (densityStr.length - 1));
                        
                        asciiImage += densityStr.charAt(charIndex || 0);
                        if ((i / 4 + 1) % asciiWidth === 0) asciiImage += "\n";
                    }

                    const block = document.createElement('div');
                    block.className = 'data-block';
                    block.innerHTML = `
                        <div class='meta-data'>${generateMetadata()}</div>
                        <div class='ascii-art'>${asciiImage}</div>
                    `;

                    block.addEventListener('click', function() {
                        if (isInspecting) return;
                        isInspecting = true;
                        
                        speakPhrase("ISOLATING NOISE.");
                        triggerModemBurst();
                        
                        overlay.innerHTML = this.outerHTML;
                        overlay.style.display = 'flex';
                        
                        void overlay.offsetWidth;

                        setTimeout(() => {
                            overlay.style.opacity = '0';
                            setTimeout(() => {
                                overlay.style.display = 'none';
                                overlay.innerHTML = '';

                    muralGrid.appendChild(block);
                    assetCount++;
                    assetCountDisplay.textContent = `BRICKS: ${String(assetCount).padStart(4, '0')}`;

                    if (muralGrid.children.length > 300) {
                        const rowHeight = muralGrid.firstChild.offsetHeight + 8;
                        
                        for(let i = 0; i < 3; i++) {
                            if (muralGrid.firstChild) {
                                muralGrid.removeChild(muralGrid.firstChild);

                        }
                        
                        currentTopPadding += rowHeight;

                    }

                    if (!isInspecting) {
                        window.scrollTo({
                            top: document.body.scrollHeight,
                            behavior: "smooth"
                        });
                    }
                }
            } catch (error) {}

            setTimeout(captureLoop, captureDelay);
        }

        function runMantra() {
            let index = 0;
            setInterval(() => {
                let phrase = aphorisms[index % aphorisms.length];
                speakPhrase(phrase);
                liveAphorism.textContent = phrase;
                index++;
            }, 3000); 
        }

        function startAll() {
            initTelecomAudio();
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            // Uso directo de getUserMedia aprovechando la persistencia de permisos del navegador concedida en el index principal
           setTimeout(()=>{
            navigator.mediaDevices.getUserMedia({ video: true, audio: false })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    captureLoop(); 
                    runMantra(); 
                })
                .catch(err => {
                    liveAphorism.textContent = "VISION REQUIRED TO INITIATE CONSUMPTION.";
                });

        }

        window.addEventListener('DOMContentLoaded', startAll);
        window.addEventListener('click', () => {
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }, { once: true });

<script>
(function() {
    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        let initialPinchDistance = null;

        function simulateMouseEvent(type, touch, button = 0) {
            const mouseEvent = new MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: touch.clientX,
                clientY: touch.clientY,
                button: button
            });
            touch.target.dispatchEvent(mouseEvent);
        }

        function getTouchDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousedown', e.touches[0], 0);
                initialPinchDistance = null;
            } else if (e.touches.length >= 2) {
                e.preventDefault();
                initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousemove', e.touches[0], 0);
            } else if (e.touches.length >= 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                const scaleFactor = currentDistance / initialPinchDistance;

                const zoomEvent = new CustomEvent('canvaszoom', {
                    detail: { scale: scaleFactor, distance: currentDistance }
                });
                canvas.dispatchEvent(zoomEvent);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            const touch = e.changedTouches[0] || e.touches[0];
            if (touch && e.touches.length === 0) {
                simulateMouseEvent('mouseup', touch, 0);
            }
        }, { passive: true });
    });
})();
</script>
