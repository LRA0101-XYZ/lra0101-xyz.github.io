<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PANOPTIC_SYS // HARSH_CRACKLE_CONSOLAS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background-color: #000000;
    overflow: hidden;
    user-select: none;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
#vg {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,0.45) 100%);
}


</style>
</head>
<body>
<div id="vg"></div>
<canvas id="matrix-canvas"></canvas>

<script>
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  const CHARS = '01XØ█▓▒░▄▀■┼║╚╔╗╝═▲▼/\\*+:'.split('');
  
  let cols, rows;
  const fontSize = 16;
  let gridData = [];
  let scrollOffset = 0;

  // --- MOTOR DE AUDIO: CRACKLE DIGITAL ÁSPERO E INDUSTRIAL + SUB-GRAVES GLITCH ---
  let audioCtx = null;
  let masterGain = null;
  let bitcrushNode = null;
  let noiseNode = null;

  const LOW_FREQS = [60.20, 58.27, 77.78]; 

  function makeBitcrushCurve(bits = 1.0) {
    let steps = Math.pow(2, bits),
        n_samples = 44100,
        curve = new Float32Array(n_samples);
    for (let i = 0; i < n_samples; ++i) {
      let x = (i * 2) / n_samples - 1;
      curve[i] = Math.round(x * steps) / steps;
    }
    return curve;
  }

  function initAudioEngine() {
    if (audioCtx) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext({ sampleRate: 44100 });
    
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.4, audioCtx.currentTime); 

    // Distorsión digital extrema (1 bit) para saturar los osciladores y ráfagas
    bitcrushNode = audioCtx.createWaveShaper();
    bitcrushNode.curve = makeBitcrushCurve(8.0);
    bitcrushNode.oversample = 'none';

    // Buffer de ruido puramente digital / crackle desestructurado (sin suavidad de ruido blanco tradicional)
    const bufferSize = audioCtx.sampleRate * 1;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      // Impulsos esporádicos y secos tipo "crackle" o estática de datos corruptos
      let val = Math.random() < 0.05 ? (Math.random() * 2 - 1) * 1.5 : (Math.random() < 0.2 ? (Math.random() * 2 - 1) * 0.2 : 0);
      output[i] = val;
    }

    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = noiseBuffer;
    noiseNode.loop = true;

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    
    noiseNode.connect(noiseGain);
    noiseGain.connect(bitcrushNode); // El crackle pasa también por el bitcrush para mayor suciedad

    bitcrushNode.connect(masterGain);
    masterGain.connect(audioCtx.destination);

    noiseNode.start(0);

    // Patrón de disparos estroboscópicos de audio ultra-cortos y cortantes
    setInterval(triggerStrobeGlitch, 25);
  }

  function triggerStrobeGlitch() {
    if (!audioCtx || audioCtx.state !== 'running') return;

    if (Math.random() < 0.1) return;

    const now = audioCtx.currentTime;
    const duration = 0.003 + (Math.random() * 0.012); // Pulsos todavía más secos

    const osc = audioCtx.createOscillator();
    const pulseGain = audioCtx.createGain();

    osc.type = Math.random() < 0.5 ? 'sawtooth' : 'square';
    const baseFreq = LOW_FREQS[Math.floor(Math.random() * LOW_FREQS.length)];
    
    osc.frequency.setValueAtTime(baseFreq * (Math.random() < 0.5 ? 1 : 4.2), now);
    osc.frequency.linearRampToValueAtTime(baseFreq * 0.2, now + duration);

    pulseGain.gain.setValueAtTime(0.7, now);
    pulseGain.gain.setValueAtTime(0.0, now + duration);

    osc.connect(pulseGain);
    pulseGain.connect(bitcrushNode);

    osc.start(now);
    osc.stop(now + duration + 0.002);
  }

  window.addEventListener('DOMContentLoaded', () => {
    initAudioEngine();
    setTimeout(triggerStart, 100);
  });

  function triggerStart() {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  window.addEventListener('click', triggerStart);
  window.addEventListener('keydown', triggerStart);
  window.addEventListener('touchstart', triggerStart);

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / (fontSize * 0.6));
    rows = Math.floor(canvas.height / fontSize) + 5;

    gridData = [];
    for (let r = 0; r < rows * 2; r++) {
      let rowCells = [];
      for (let c = 0; c < cols; c++) {
        rowCells.push({
          char: CHARS[Math.floor(Math.random() * CHARS.length)],
          infected: false,
          level: 0,
          colorType: 0
        });
      }
      gridData.push(rowCells);
    }
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function updateSimulation() {
    const totalCells = cols * rows;
    const infectionSpeed = Math.floor(totalCells * 0.008) + 5;

    for (let k = 0; k < infectionSpeed; k++) {
      let r = Math.floor(Math.random() * gridData.length);
      let c = Math.floor(Math.random() * cols);
      
      let cell = gridData[r][c];
      cell.infected = true;
      cell.level = Math.min(cell.level + 1, 3);
      cell.char = CHARS[Math.floor(Math.random() * CHARS.length)];

      const rand = Math.random();
      if (rand < 0.3) cell.colorType = 1;
      else if (rand < 0.55) cell.colorType = 2;
      else if (rand < 0.8) cell.colorType = 3;
      else cell.colorType = 4;
    }

    scrollOffset += 3.5;
    if (scrollOffset >= fontSize) {
      scrollOffset = 0;
      gridData.pop();
      let newRow = [];
      for (let c = 0; c < cols; c++) {
        newRow.push({
          char: CHARS[Math.floor(Math.random() * CHARS.length)],
          infected: false,
          level: 0,
          colorType: 0
        });
      }
      gridData.unshift(newRow);
    }
  }

  function draw() {
    const isStrobeFrame = Math.random() < 0.2;

    ctx.fillStyle = isStrobeFrame ? '#ffffff' : '#000000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = `${fontSize}px Consolas, 'Courier New', Courier, monospace`;
    ctx.textBaseline = 'top';

    const xOffsetChar = fontSize * 0.6;

    for (let r = 0; r < gridData.length; r++) {
      let y = (r * fontSize) - scrollOffset;
      if (y < -fontSize || y > canvas.height) continue;

      for (let c = 0; c < cols; c++) {
        let cell = gridData[r][c];
        let x = c * xOffsetChar;

        if (isStrobeFrame) {
          ctx.fillStyle = '#000000';
        } else {
          if (cell.colorType === 1) ctx.fillStyle = '#004400';
          else if (cell.colorType === 2) ctx.fillStyle = '#00ff00';
          else if (cell.colorType === 3) ctx.fillStyle = '#ff0000';
          else if (cell.colorType === 4) ctx.fillStyle = '#00ff00';
          else ctx.fillStyle = '#031103';
        }

        ctx.fillText(cell.char, x, y);
      }
    }
  }

  function loop() {
    updateSimulation();
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
</script>
</body>
</html>
