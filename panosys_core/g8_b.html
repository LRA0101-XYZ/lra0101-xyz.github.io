<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PANOSYS // Instrumentalization Logs</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: var(--psys-font);
            color: #00ff55; user-select: none;
            cursor:crosshair;
        }


        /* Raster Overlay */
        #crt-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(10, 10, 10, 0) 50%, rgba(0, 0, 0, 0.7) 50%), 
                        linear-gradient(90deg, rgba(255,42,42, 0.03), rgba(0,255,85, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 4px 100%;
            z-index: 10; pointer-events: none;
            box-shadow: inset 0 0 200px rgba(0,0,0,1);
        }

        /* Glitch & Strobe Layer */
        #glitch-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="1.5" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.8"/></svg>');
            mix-blend-mode: exclusion; z-index: 15; pointer-events: none;
            opacity: 0; transition: opacity 0.1s;
        }

        #strobe-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; mix-blend-mode: overlay; z-index: 16; pointer-events: none;
            opacity: 0;
        }
        
        .glitch-active { animation: crtGlitch 0.1s steps(2, end) infinite; }
        .strobe-active { animation: strobeAnim 0.05s infinite; }

        @keyframes crtGlitch {
            0% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); opacity: 0.8; }
            25% { transform: translate(-20px, 10px) scale(1.05); filter: hue-rotate(90deg); opacity: 0.9; }
            50% { transform: translate(20px, -10px) scale(0.95); filter: invert(1); opacity: 0.6; }
            75% { transform: translate(-10px, 20px) scale(1.02); filter: hue-rotate(-90deg) grayscale(1); opacity: 1; }
            100% { transform: translate(0, 0) scale(1); filter: hue-rotate(0deg); opacity: 0.8; }
        }

        @keyframes strobeAnim {
            0% { opacity: 0; background: #fff; }
            50% { opacity: 0.8; background: #ff2a2a; }
            100% { opacity: 0; background: #fff; }
        }

        /* VERTICAL UI TERMINAL (RESPONSIVE HUD) */
        #terminal-ui {
            position: absolute; top: 20px; right: 20px; width: 350px;
            background: rgba(0, 10, 0, 0.85); border: 1px solid #00ff55;
            box-shadow: -5px 0 40px rgba(0,255,85, 0.15); padding: 25px;
            z-index: 20; pointer-events: auto; backdrop-filter: blur(8px);
            display: flex; flex-direction: column; box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* GREEN ANSI ART BLOCK */
        #ansi-art {
            font-family: var(--psys-font); font-size: 11px; line-height: 11px; color: #00ff55; 
            text-shadow: var(--psys-glow-sm); white-space: pre; margin-bottom: 20px; 
            border-bottom: 1px dashed #0a0; padding-bottom: 10px; text-align: center; 
            overflow: hidden; height: 100px; flex-shrink: 0;
        }

        .ansi-bright { color: #5f5; text-shadow: var(--psys-glow-lg); }
        .ansi-dim { color: #050; }

        h2 { margin: 0 0 10px 0; font-size: 1.1em; color: #fff; text-shadow: var(--psys-glow-sm); border-bottom: 1px solid #030; padding-bottom: 5px; letter-spacing: 2px;}
        p { font-size: 0.85em; color: #0a0; line-height: 1.6; margin-bottom: 20px; opacity: 0.9; }

        .options { display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

        button {
            background: #000; color: #0a0; border: 1px solid #050; padding: 15px;
            font-family: inherit; font-size: 0.8em; cursor: pointer; text-transform: uppercase;
            text-align: left; transition: all 0.2s; letter-spacing: 1px; flex-shrink: 0;
        }
        button:hover { background: #00ff55; color: #000; box-shadow: 0 0 20px #0a0; }
        button:disabled { background: #000; color: #111; border-color: #050505; pointer-events: none; }

        /* Hypnotic Death Screen & Panic Strobe */
        #collapse-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100; display: none;
            overflow: hidden; pointer-events: none;
        }
        
        #data-flow {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            color: #00ff55; font-family: var(--psys-font); font-size: 16px; line-height: 16px;
            word-wrap: break-word; overflow: hidden; opacity: 0.35;
            text-shadow: var(--psys-glow-sm); white-space: pre-wrap;
        }

        .hypno-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #00ff55; font-size: 5.5em; font-weight: bold;
            text-transform: uppercase; letter-spacing: 15px; text-shadow: var(--psys-glow-lg);
            mix-blend-mode: exclusion; width: 100%;
        }

        .kernel-panic-active { animation: panicStrobe 0.15s infinite; }

        @keyframes panicStrobe {
            0% { background-color: rgba(255,42,42, 0.4); color: #000000; }
            50% { background-color: rgba(0, 0, 0, 0.7); color: #ff2a2a; }
            100% { background-color: rgba(255, 255, 255, 0.3); color: #000000; }
        }

        .sys-warning { position: absolute; top: 20px; right: 20px; color: #ff2a2a; font-size: 0.7em; z-index: 5; text-align: right; text-shadow: var(--psys-glow-lg); pointer-events: none; letter-spacing: 2px;}

        /* MEDIA QUERIES PARA ADAPTABILIDAD MÓVIL */
        @media (max-width: 768px) and (orientation: portrait) {
            #terminal-ui {
                top: auto; right: 10px; left: 10px; bottom: 10px; width: calc(100% - 20px);
                padding: 15px; box-shadow: 0 -5px 30px rgba(0,255,85, 0.15);
            }
            #ansi-art { display: none; }
            h2 { font-size: 0.9em; margin-bottom: 5px; }
            p { font-size: 0.75em; margin-bottom: 10px; line-height: 1.3; }
            button { padding: 10px; font-size: 0.75em; }
            .sys-warning { top: 10px; right: 10px; font-size: 0.6em; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            #terminal-ui {
                top: 10px; bottom: auto; right: 10px; left: auto; width: 40%;
                padding: 12px; box-shadow: -5px 0 30px rgba(0,255,85, 0.15);
            }
            #ansi-art, #terminal-ui p { display: none; }
            h2 { font-size: 0.75em; margin-bottom: 8px; border-bottom: 1px solid #020; }
            .options { gap: 4px; }
            button { padding: 6px 10px; font-size: 0.65em; }
            .sys-warning { display: none !important; }
            .hypno-text { font-size: 2em; letter-spacing: 5px; }
        }

        @media (max-width: 480px) and (orientation: portrait) {
            #terminal-ui { bottom: 10px; }
            .hypno-text { font-size: 2.2em; letter-spacing: 6px; }
        }

        #vg {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,0.95) 100%);
        #webgl-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    </style>

            body > *:not(#rotate-warning) { display: none !important; }
        }

<body><div id="rotate-warning">
    <div style="font-size: 24px; margin-bottom: 15px;">⟳</div>
    <h2 style="font-size: 14px; letter-spacing: 2px; margin-bottom: 10px;">ROTATE YOUR DEVICE</h2>
    <p style="font-size: 10px; color: #00aa44;">THIS SYSTEM REQUIRES LANDSCAPE MODE TO OPERATE</p></div>

    <div id="collapse-screen">
        <div id="data-flow"></div>
        <div class="hypno-text" id="hypno-msg">THE FUTURE<br>ARRIVED<br>ALREADY USED</div>
    </div>

    <div id="webgl-container"></div>
    <div id="crt-overlay"></div>
    <div id="glitch-layer"></div>
    <div id="strobe-layer"></div>

    <div class="sys-warning" id="lag-warning" style="display:none;">
        >>> PREDICTIVE BRANCHING <<< <br>
        PRUNING UNPROFITABLE FUTURES...
    </div>

    <div id="terminal-ui">
        <pre id="ansi-art"></pre>
        <h2 id="node-title">DATA FEED // CYCLES REMAINING: 13</h2>
        <p id="node-desc">INITIALIZING FEED...</p>
        <div class="options" id="node-options"></div>
    </div>

    <script>
        window.timeScale = 1.0;
        let maleVoice = null;

        // SPEECH SYNTHESIS VOICE SELECTION
        function loadVoices() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                maleVoice = voices.find(v => {
                    const name = v.name.toLowerCase();
                    return name.includes('david') || name.includes('male') || name.includes('mark') || name.includes('pablo') || name.includes('raul') || name.includes('microsoft zira') === false;
                }) || voices[0];
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
            loadVoices();
        }

        // ANSI
        const ansiChars = ['█', '▓', '▒', '░', '│', '┃', '║', '-', '=', '≡', ' '];
        function generateDefragANSI() {
            let art = '';
            for(let i=0; i<8; i++) {
                let row = '';
                for(let j=0; j<35; j++) {
                    const char = ansiChars[Math.floor(Math.random() * ansiChars.length)];
                    const rand = Math.random();
                    if(rand > 0.8) row += `<span class="ansi-bright">${char}</span>`;
                    else if(rand < 0.3) row += `<span class="ansi-dim">${char}</span>`;
                    else row += char;
                }
                art += row + '\n';
            }
            const ansiElement = document.getElementById('ansi-art');
            if(ansiElement) ansiElement.innerHTML = art;
        }
        generateDefragANSI(); 

        // AUDIO
        let audioCtx, delayNode, masterGain, droneOsc1, droneOsc2, droneGain;
        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const carrier = audioCtx.createOscillator();
            carrier.type = 'sine'; carrier.frequency.value = 1800;
            const carrierGain = audioCtx.createGain(); carrierGain.gain.value = 0.005;
            carrier.connect(carrierGain); carrierGain.connect(audioCtx.destination);
            carrier.start();

            delayNode = audioCtx.createDelay(); delayNode.delayTime.value = 0.01;
            const feedback = audioCtx.createGain(); feedback.gain.value = 0.65;
            delayNode.connect(feedback); feedback.connect(delayNode);
            
            masterGain = audioCtx.createGain(); masterGain.gain.value = 0.04; 
            delayNode.connect(masterGain); masterGain.connect(audioCtx.destination);
            scheduleStepCut();
        }

        function scheduleStepCut() {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            osc.type = Math.random() > 0.5 ? 'square' : 'sawtooth';
            const graveFreqs = [40, 55, 70, 85, 110, 120];
            osc.frequency.setValueAtTime(graveFreqs[Math.floor(Math.random() * graveFreqs.length)], t);

            const gain = audioCtx.createGain(); const dur = Math.random() * 0.02 + 0.005; 
            gain.gain.setValueAtTime(0, t);
            gain.gain.setValueAtTime(Math.random() * 0.8 + 0.2, t + 0.001); 
            gain.gain.setValueAtTime(0, t + dur); 
            
            osc.connect(gain); gain.connect(delayNode); gain.connect(masterGain);    
            osc.start(t); osc.stop(t + dur + 0.05);

            setTimeout(scheduleStepCut, (Math.random() > 0.7) ? (Math.random() * 40 + 10) : (Math.random() * 800 + 200));
        }

        function playHandshakeBurst() {
            if(!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc1 = audioCtx.createOscillator(); osc1.type = 'square'; osc1.frequency.setValueAtTime(2400, t); osc1.frequency.setValueAtTime(1200, t + 0.1); 
            const osc2 = audioCtx.createOscillator(); osc2.type = 'sawtooth'; osc2.frequency.setValueAtTime(3200, t); osc2.frequency.exponentialRampToValueAtTime(600, t + 0.3);
            const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.3, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.3);
            osc1.connect(gain); osc2.connect(gain); gain.connect(audioCtx.destination);
            osc1.start(t); osc2.start(t); osc1.stop(t + 0.3); osc2.stop(t + 0.3);
        }

        function playDryCrackle(duration = 0.1, freq = 2000) {
            if(!audioCtx) return;
            const bufferSize = audioCtx.sampleRate * duration; 
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
            const noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter(); filter.type = 'highpass'; filter.frequency.value = freq; 
            const gainNode = audioCtx.createGain(); gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            noiseSource.connect(filter); filter.connect(gainNode); gainNode.connect(audioCtx.destination);
            noiseSource.start();
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = 0.2; utterance.rate = 0.75; utterance.volume = 0.9; utterance.lang = 'en-US'; 
                if (maleVoice) utterance.voice = maleVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // LORE
        const r = (arr) => arr[Math.floor(Math.random() * arr.length)];
        // DARK · lore de la maquina: los futuros cancelados son ramas que el modelo predice y poda.
        // Cada ciclo ofrece tres futuros; el bioterminal elige, el modelo ejecuta el suyo; las ramas podadas se venden como datos de entrenamiento.
        // (se lee de atras para adelante: [12] al empezar, [0] en el ultimo ciclo)
        const loreProgressive = [
            "ONE CYCLE REMAINS. IT WILL BE IDENTICAL TO THE FIRST.",
            "NEXT YEAR HAS ALREADY BEEN RENDERED, INDEXED AND MONETIZED.",
            "BIOTERMINAL BEHAVIOR NOW MATCHES ITS FORECAST AT 99.7%.",
            "THE LOOP HAS NO OUTSIDE. EVERY EXIT RESOLVES TO THE FEED.",
            "YOUR ATTENTION IS THE CLOCK SIGNAL OF THE SYSTEM OF SYSTEMS.",
            "EVERY PRUNED BRANCH IS SOLD AS TRAINING DATA.",
            "THE TIMELINE IS A FEED. IT ONLY SCROLLS DOWN.",
            "CHOICE IS THE PROCESSING DELAY BETWEEN PREDICTION AND EXECUTION.",
            "EVERY FUTURE IS PRECOMPUTED. YOU ARE WALKING THROUGH A CACHE.",
            "YOUR INPUT WAS LOGGED AS A PREFERENCE. THE MODEL EXECUTED ITS OWN.",
            "TWO BRANCHES PRUNED. THEY WERE NOT PROFITABLE ENOUGH TO RENDER.",
            "THE SYNTHETIC MEDIUM PRODUCES THE FUTURES IT PREDICTS.",
            "PREDICTIVE BRANCHING ONLINE. THREE FUTURES PER CYCLE. THE MODEL KEEPS ONE."
        ];

        // opciones: futuros que ofrece la plataforma (todos llevan al mismo feed) y, a veces, una salida que nunca se ejecuta
        const OPTIONS = ["REFRESH THE FEED", "AUTOPLAY THE NEXT ONE", "ACCEPT THE RECOMMENDATION", "CONTINUE WATCHING", "REPEAT YESTERDAY",
            "RENEW AUTOMATICALLY", "UPGRADE THE PLAN", "ALLOW NOTIFICATIONS", "BUY THE SAME AGAIN", "FOLLOW THE TREND", "MATCH THE PREDICTION",
            "LET THE MODEL DECIDE", "SHARE YOUR LOCATION", "EXTEND THE SESSION", "SKIP THE WAIT", "RESTORE DEFAULTS", "SYNC SLEEP TO THE SERVER",
            "OPEN ONE MORE TAB", "RATE YOUR LAST CYCLE", "KEEP ME SIGNED IN"];
        const EXITS = ["LOG OFF", "LEAVE THE FEED", "DISCONNECT", "DELETE THE ACCOUNT", "DO NOTHING", "CLOSE THE WINDOW", "OPT OUT", "STAY OFFLINE"];
        // lo que dicen las cajas: la rama podada y por que (rojo), la rama ejecutada (verde)
        const PRUNE_WHY = ["LOW YIELD", "NOT PROFITABLE", "BELOW THRESHOLD", "OFF FORECAST", "NOT RENDERED", "ROLLED BACK", "NULL ROUTE", "DEPRECATED"];
        const EXIT_WHY = ["EXIT DENIED", "NO ROUTE OUT", "OUTSIDE NOT FOUND"];
        let cycleOptions = [];

        // THREE.JS SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000100, 0.00004); 

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 50000);
        camera.position.set(0, 150, 400);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000);
        document.getElementById('webgl-container').appendChild(renderer.domElement);

        const renderScene = new THREE.RenderPass(scene, camera);
        const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.5, 0.6, 0.1);
        bloomPass.strength = 2.5; 
        
        const composer = new THREE.EffectComposer(renderer);
        composer.addPass(renderScene); composer.addPass(bloomPass);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.02;
        controls.zoomSpeed = 3.0; controls.maxDistance = 20000;

        // SCENE ITEMS
        const mainFloor = new THREE.GridHelper(40000, 500, 0x00ff00, 0x004400); mainFloor.position.y = -200; scene.add(mainFloor);
        const mainCeil = new THREE.GridHelper(40000, 500, 0x00aa00, 0x002200); mainCeil.position.y = 300; scene.add(mainCeil);

        for(let i=1; i<=15; i++) {
            const wall = new THREE.GridHelper(10000, 100, 0x008800, 0x001100);
            wall.rotation.x = Math.PI / 2; wall.position.z = -1000 * i; wall.position.y = 50;
            scene.add(wall);
        }

        const solidGreenMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const pastGreenMat = new THREE.MeshBasicMaterial({ color: 0x004400, transparent: true, opacity: 0.6 });
        const solidRedMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const tubeRedMat = new THREE.MeshBasicMaterial({ color: 0xff0022, transparent: true, opacity: 0.95 }); 
        const nodeCoreGeo = new THREE.BoxGeometry(15, 15, 15);

        function createHypercubeNode(isDead = false) {
            const group = new THREE.Group();
            const core = new THREE.Mesh(nodeCoreGeo, isDead ? solidRedMat : solidGreenMat); group.add(core);
            const outerGeo = new THREE.BoxGeometry(40, 40, 40);
            const shellMat = isDead ? new THREE.LineBasicMaterial({color: 0xff2222, opacity: 0.8, transparent: true}) : new THREE.LineBasicMaterial({color: 0x00ff00, opacity: 0.8, transparent: true});
            const outerMesh = new THREE.LineSegments(new THREE.EdgesGeometry(outerGeo), shellMat); group.add(outerMesh);
            return group;
        }

        function createThickLine(vStart, vEnd, material) {
            const tubeGeo = new THREE.TubeGeometry(new THREE.LineCurve3(vStart, vEnd), 2, 5, 6, false);
            const mesh = new THREE.Mesh(tubeGeo, material); scene.add(mesh);
            return mesh;
        }

        // cajas: arriba la rama que se ofrecia, abajo su estado. Rojo = podada, verde = ejecutada por el modelo
        function createTextSprite(top, bottom, live) {
            const canvas = document.createElement('canvas'); canvas.width = 600; canvas.height = 150;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = live ? 'rgba(0, 24, 8, 0.9)' : 'rgba(30, 0, 0, 0.9)'; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = live ? '#00ff55' : '#ff2a2a'; ctx.lineWidth = 10; ctx.strokeRect(0,0, canvas.width, canvas.height);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            let size = 36; ctx.font = `bold ${size}px Consolas, monospace`;
            while (ctx.measureText(top).width > 560 && size > 18) { size -= 2; ctx.font = `bold ${size}px Consolas, monospace`; }
            ctx.fillStyle = '#ffffff'; ctx.fillText(top, canvas.width/2, bottom ? 52 : canvas.height/2);
            if (bottom) { ctx.font = 'bold 30px Consolas, monospace'; ctx.fillStyle = live ? '#00ff55' : '#ff2a2a'; ctx.fillText(bottom, canvas.width/2, 106); }

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.scale.set(300, 75, 1); return sprite;   // dos renglones: un poco mas grande para que se lea
        }

        function createDeadPath(vStart, vEnd, opt) {
            scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.LineCurve3(vStart, vEnd), 4.0, 5, 6, false), tubeRedMat));
            const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(35, 1), new THREE.MeshBasicMaterial({ color: 0xff0000, wireframe: true, transparent: true, opacity: 0.7 }));
            blob.position.copy(vEnd); scene.add(blob);
            const deadNode = createHypercubeNode(true); deadNode.position.copy(vEnd); deadNode.scale.setScalar(0.9); scene.add(deadNode);
            const textBlob = opt ? createTextSprite(`[${opt.k}] ${opt.t}`, opt.exit ? r(EXIT_WHY) : 'PRUNED · ' + r(PRUNE_WHY)) : createTextSprite('[ PRUNED ]');
            textBlob.position.copy(vEnd); textBlob.position.y += 60; scene.add(textBlob);
        }

        let remainingCycles = 13; let activeNodeObj = null; let activePos = new THREE.Vector3(0, 0, 0); let loopRadius = 2500;

<script>
(function() {
    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        let initialPinchDistance = null;

        function simulateMouseEvent(type, touch, button = 0) {
            const mouseEvent = new MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: touch.clientX,
                clientY: touch.clientY,
                button: button
            });
            touch.target.dispatchEvent(mouseEvent);
        }

        function getTouchDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousedown', e.touches[0], 0);
                initialPinchDistance = null;
            } else if (e.touches.length >= 2) {
                e.preventDefault();
                initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousemove', e.touches[0], 0);
            } else if (e.touches.length >= 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                const scaleFactor = currentDistance / initialPinchDistance;

                const zoomEvent = new CustomEvent('canvaszoom', {
                    detail: { scale: scaleFactor, distance: currentDistance }
                });
                canvas.dispatchEvent(zoomEvent);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            const touch = e.changedTouches[0] || e.touches[0];
            if (touch && e.touches.length === 0) {
                simulateMouseEvent('mouseup', touch, 0);
            }
        }, { passive: true });
    });
})();
</script>
