<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SYS_SURVEILLANCE // 0x00</title>
    <style>
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Consolas', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .terminal-box {
            border: 1px dashed #00ff00;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            background: rgba(0, 255, 0, 0.02);
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }
        .main-text {
            font-size: 1.3rem;
            letter-spacing: 4px;
            color: #00ff00;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.4);
            margin: 0 0 15px 0;
        }
        .sub-text {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #00ff00;
            opacity: 0.7;
            margin: 0 0 25px 0;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            border: 1px solid #00ff00;
            background: rgba(0, 255, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
            animation: load 10s linear forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        #vg {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 50%, transparent 20%, rgba(0,0,0,0.95) 100%);
}
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                // Mandar mensaje al index principal
                window.top.postMessage('KILL_SESSION', '*');

                // Apagar el iframe
                document.body.innerHTML = '';
                document.body.style.backgroundColor = '#000000';
                document.body.style.cursor = 'none';
            }, 10000);
        });
    </script>
</head>
<body>
    <div id="vg"></div>
    <div class="terminal-box">
        <p class="main-text"> SYSTEM REMAINS. YOU DO NOT. </p>
        <p class="sub-text">CLOSING_PORT // DUMPING_GARBAGE_THREAD</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>
</body>
</html>
