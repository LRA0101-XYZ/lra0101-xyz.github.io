<script>
(function() {
    window.addEventListener('DOMContentLoaded', () => {
        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        let initialPinchDistance = null;

        function simulateMouseEvent(type, touch, button = 0) {
            const mouseEvent = new MouseEvent(type, {
                bubbles: true,
                cancelable: true,
                view: window,
                clientX: touch.clientX,
                clientY: touch.clientY,
                button: button
            });
            touch.target.dispatchEvent(mouseEvent);
        }

        function getTouchDistance(t1, t2) {
            const dx = t1.clientX - t2.clientX;
            const dy = t1.clientY - t2.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousedown', e.touches[0], 0);
                initialPinchDistance = null;
            } else if (e.touches.length >= 2) {
                e.preventDefault();
                initialPinchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                e.preventDefault();
                simulateMouseEvent('mousemove', e.touches[0], 0);
            } else if (e.touches.length >= 2 && initialPinchDistance !== null) {
                e.preventDefault();
                const currentDistance = getTouchDistance(e.touches[0], e.touches[1]);
                const scaleFactor = currentDistance / initialPinchDistance;

                const zoomEvent = new CustomEvent('canvaszoom', {
                    detail: { scale: scaleFactor, distance: currentDistance }
                });
                canvas.dispatchEvent(zoomEvent);
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
            const touch = e.changedTouches[0] || e.touches[0];
            if (touch && e.touches.length === 0) {
                simulateMouseEvent('mouseup', touch, 0);
            }
        }, { passive: true });
    });
})();
</script>

(function () {
  if (!window.DARK2) return;
  const area = () => ({ x: 0, y: 0, w: innerWidth, h: innerHeight });
  const T0 = performance.now();
  function vitals(c, D, A, d, r) {
    const t = (performance.now() - T0) / 1000, rows = [['PULSE', 0.9], ['SIGNAL', 1.6], ['OBSERVER', 2.4]], h = r.h / rows.length;
    rows.forEach(([name, last], i) => {
      const y = r.y + i * h + h * 0.6, dead = t > last + 0.6;
      c.strokeStyle = dead ? d.G(0.55) : d.Wt(0.9); c.lineWidth = 1; c.beginPath();
      for (let x = 0; x <= r.w; x += 3) { const u = x / r.w, ph = u * 6 - (t - last) * 3; let v = 0; if (!dead && ph > -1 && ph < 0) v = Math.sin(ph * Math.PI * 4) * Math.exp(ph * 3) * (h * 0.4); x ? c.lineTo(r.x + x, y - v) : c.moveTo(r.x + x, y - v); }
      c.stroke();
      d.text(name, r.x - 8, y + 3, d.G(0.6), 'right'); d.text(dead ? '0.0' : '—', r.x + r.w + 8, y + 3, dead ? d.R(0.9) : d.Wt(0.8), 'left', true);
    });
    d.text('FLATLINE · T+' + d.f1(t) + 's · NO BACKUP EXISTS', r.x, r.y + r.h + 12, d.G(0.5));
  }
  DARK2.viz({
    code: 'FLATLINE', z: 40, area,
    probe() { return { pts: [] }; },
    layers: [{ type: 'fn', draw: vitals, at: [0.3, 0.76, 0.4, 0.13] }, { type: 'frame' }]
  });
})();
</script>
